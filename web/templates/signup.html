<div class="screen auth-screen">
  <!-- Back Button -->
  <button class="auth-back" id="btn-auth-back">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </button>

  <!-- Header -->
  <div class="auth-header">
    <h1>Create Account</h1>
    <p>Join ATM to track your learning journey</p>
  </div>

  <!-- Form -->
  <form class="auth-form" id="signup-form">
    <div class="form-group">
      <label class="form-label">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Full Name
      </label>
      <input type="text" id="input-name" class="form-input" placeholder="Enter your name" required>
    </div>

    <div class="form-group">
      <label class="form-label">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        Phone Number
      </label>
      <div class="phone-input-group">
        <span class="country-code">+91</span>
        <input type="tel" id="input-phone" class="form-input" placeholder="Enter phone number" pattern="[0-9]{10}" maxlength="10" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Grade/Class</label>
        <select id="select-grade" class="form-select" required>
          <option value="">Select</option>
          <option value="6">Class 6</option>
          <option value="7">Class 7</option>
          <option value="8">Class 8</option>
          <option value="9">Class 9</option>
          <option value="10">Class 10</option>
          <option value="11">Class 11</option>
          <option value="12">Class 12</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">School</label>
        <input type="text" id="input-school" class="form-input" placeholder="School name">
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-lg btn-block" id="btn-submit">
      Create Account
    </button>
  </form>

  <!-- Divider -->
  <div class="auth-divider">
    <span>or continue with</span>
  </div>

  <!-- Social Login -->
  <div class="social-buttons">
    <button class="btn btn-social" id="btn-google">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Google
    </button>
  </div>

  <!-- Switch to Sign In -->
  <p class="auth-switch">
    Already have an account? <a href="#" id="link-signin">Sign In</a>
  </p>
</div>
