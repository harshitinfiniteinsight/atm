<div class="screen s6-upload">
  <!-- Header -->
  <div class="screen-header compact">
    <h1>Upload</h1>
  </div>

  <!-- Main Content Sections -->
  <div class="upload-content">
    <!-- Assessment Selector Section -->
    <div class="content-section">
      <label class="section-label">Select Assessment</label>
      <div class="assessment-selector">
        <div id="assessment-list" class="assessment-list">
          <!-- Assessments will be populated here -->
        </div>
      </div>
    </div>

    <!-- Upload Methods Section -->
    <div class="content-section">
      <label class="section-label">Choose Method</label>
      <div class="upload-options horizontal">
        <button class="upload-option-btn compact" id="btn-camera">
          <div class="option-icon camera">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <span class="option-label">Camera</span>
        </button>

        <button class="upload-option-btn compact" id="btn-scan">
          <div class="option-icon scan">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
              <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
              <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
              <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
              <line x1="7" y1="12" x2="17" y2="12"/>
            </svg>
          </div>
          <span class="option-label">Scan</span>
        </button>

        <button class="upload-option-btn compact" id="btn-upload-file">
          <div class="option-icon upload">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <span class="option-label">Files</span>
        </button>
      </div>
    </div>

    <!-- File List Section -->
    <div class="content-section">
      <div class="file-list" id="file-list">
        <!-- Files will be added here dynamically -->
      </div>
    </div>

    <!-- Tips as compact inline -->
    <div class="content-section tips-compact">
      <div class="tips-inline">
        <span class="tip-icon">💡</span>
        <span>Good lighting • Flat surface • Full page visible</span>
      </div>
    </div>
  </div>

  <!-- Hidden file inputs -->
  <input type="file" id="camera-input" accept="image/*" capture="environment" multiple hidden>
  <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png,image/*" multiple hidden>

  <!-- Submit Button (Sticky Footer) -->
  <div class="upload-footer">
    <button id="btn-submit" class="btn btn-primary btn-lg btn-block" disabled>
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Submit for Grading
    </button>
    <p class="text-center text-sm text-muted">Max 10 files, 10MB each</p>
  </div>
</div>
