<div class="screen s1-student-context">
  <!-- Header -->
  <div class="screen-header">
    <h1>Tell us about yourself</h1>
    <p class="subtitle">This helps us personalize your assessment</p>
  </div>

  <!-- Form -->
  <div class="form-card">
    <!-- Personal Info Section -->
    <div class="section-title">Personal Information</div>
    
    <div class="form-group">
      <label class="form-label">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Your Name <span class="required">*</span>
      </label>
      <input type="text" id="input-name" class="form-input" placeholder="Enter your full name" required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">
          Grade/Class <span class="required">*</span>
        </label>
        <select id="select-grade" class="form-select" required>
          <option value="">Select grade</option>
          <option value="6">Class 6</option>
          <option value="7">Class 7</option>
          <option value="8">Class 8</option>
          <option value="9">Class 9</option>
          <option value="10">Class 10</option>
          <option value="11">Class 11</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">
          Age <span class="required">*</span>
        </label>
        <input type="number" id="input-age" class="form-input" placeholder="Age" min="10" max="20" required>
      </div>
    </div>

    <!-- Location Section -->
    <div class="section-title">Location</div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          Country <span class="required">*</span>
        </label>
        <select id="select-country" class="form-select" required>
          <option value="">Select country</option>
          <option value="India">India</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group" id="state-group" style="display: none;">
        <label class="form-label">
          State <span class="required">*</span>
        </label>
        <select id="select-state" class="form-select">
          <option value="">Select state</option>
        </select>
      </div>
    </div>

    <!-- Academic Section -->
    <div class="section-title">Academic Details</div>

    <div class="form-group">
      <label class="form-label">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Curriculum/Board <span class="required">*</span>
      </label>
      <div class="form-input" style="background: var(--color-bg); color: var(--color-text-secondary); display: flex; align-items: center; gap: var(--space-sm);">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        CBSE (Central Board of Secondary Education)
      </div>
      <input type="hidden" id="select-board" value="CBSE">
    </div>

    <div class="form-group">
      <label class="form-label">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        School Name <span class="required">*</span>
      </label>
      <input type="text" id="input-school" class="form-input" placeholder="Enter your school name" required>
    </div>

    <div class="form-group">
      <label class="form-label">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Subject <span class="required">*</span>
      </label>
      <select id="select-subject" class="form-select" required>
        <option value="">Select subject</option>
        <option value="English">English</option>
        <option value="Science">Science</option>
        <option value="Social">Social Studies</option>
      </select>
    </div>
  </div>

  <!-- Continue Button -->
  <div class="mt-xl">
    <button id="btn-continue" class="btn btn-primary btn-lg btn-block" disabled>
      Continue
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>
</div>
