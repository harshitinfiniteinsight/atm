<div class="screen history-screen">
  <!-- Header -->
  <div class="screen-header">
    <h1>Assessment History</h1>
    <p class="subtitle">View your past assessments and progress</p>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="all">All</button>
    <button class="filter-tab" data-filter="completed">Completed</button>
    <button class="filter-tab" data-filter="in-progress">In Progress</button>
  </div>

  <!-- History List -->
  <div class="history-list" id="history-list">
    <!-- Empty State -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
      </div>
      <h3>No assessments yet</h3>
      <p>Start your first assessment to see your history here</p>
      <button class="btn btn-primary" id="btn-start-new">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Create Assessment
      </button>
    </div>

    <!-- Sample History Items (populated by JS) -->
    <div class="history-items" id="history-items" style="display: none;">
      <!-- Items will be inserted here -->
    </div>
  </div>

  <!-- Summary Stats -->
  <div class="history-summary" id="history-summary" style="display: none;">
    <div class="summary-card">
      <div class="summary-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>This Month</span>
      </div>
      <div class="summary-stats">
        <div class="summary-stat">
          <span class="stat-num" id="month-total">0</span>
          <span class="stat-text">Assessments</span>
        </div>
        <div class="summary-stat">
          <span class="stat-num" id="month-avg">0%</span>
          <span class="stat-text">Avg Score</span>
        </div>
        <div class="summary-stat">
          <span class="stat-num" id="month-time">0h</span>
          <span class="stat-text">Time Spent</span>
        </div>
      </div>
    </div>
  </div>
</div>
